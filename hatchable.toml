# Hatchable Platform Manifest for StrangersMeetup
[project]
name = "strangersmeetup"
version = "1.0.0"
runtime = "zero-build"
public_dir = "public"
api_dir = "api"
migrations_dir = "migrations"

[environment]
APP_NAME = "StrangersMeetup"
APP_ENV = "production"
MIN_AGE = 21
SUPPORTED_REGIONS = ["TN", "PY", "KA", "KL"]
SUPPORTED_REGIONS_LABEL = "Tamil Nadu, Puducherry, Karnataka, Kerala"

# Declared platform secrets (resolved dynamically at runtime via config.get())
[[secret]]
name = "TELEGRAM_BOT_TOKEN"
description = "Official Telegram Bot token issued by @BotFather"
required = true

[[secret]]
name = "TELEGRAM_BOT_USERNAME"
description = "Telegram Bot username (without @)"
required = true

[[secret]]
name = "TELEGRAM_WEBHOOK_SECRET"
description = "Shared secret token sent in X-Telegram-Bot-Api-Secret-Token header"
required = true

[[secret]]
name = "TELEGRAM_INSIDER_CHANNEL_ID"
description = "Private Telegram Channel ID for Insider Tier (e.g. -1001234567890)"
required = true

[[secret]]
name = "TELEGRAM_SOCIAL_PLUS_CHANNEL_ID"
description = "Private Telegram Channel ID for Social Plus Tier (e.g. -1001234567891)"
required = true

[[secret]]
name = "TELEGRAM_VIP_CHANNEL_ID"
description = "Private Telegram Channel ID for VIP Circle Tier (e.g. -1001234567892)"
required = true

[[secret]]
name = "APP_SECRET"
description = "Internal cryptographic secret for HMAC signatures and session verification"
required = true

[[secret]]
name = "GRIEVANCE_EMAIL"
description = "Designated statutory Grievance Officer email address under IT Rules 2021"
required = false

# Recurring background scheduler for subscription expiration & access revocation
[[cron]]
schedule = "0 * * * *"
endpoint = "/api/cron/reconcile-subscriptions"
description = "Hourly audit of expired subscriptions and channel entitlement revocation"
