<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a3b2c"/>
      <stop offset="50%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#140e0a"/>
    </radialGradient>
    <radialGradient id="lamp1" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#ffe3a8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f3a953" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f3a953" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp2" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffcf87" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#d47a32" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d47a32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2a1d"/>
      <stop offset="100%" stop-color="#1c120c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
