      <stop offset="0%" stop-color="#422212"/>
      <stop offset="50%" stop-color="#211208"/>
      <stop offset="100%" stop-color="#0d0603"/>
    </radialGradient>
    <radialGradient id="candleglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd599" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ea8c38" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ea8c38" stop-opacity="0"/>
