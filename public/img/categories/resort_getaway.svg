<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102e33"/>
      <stop offset="60%" stop-color="#1a4c54"/>
      <stop offset="100%" stop-color="#2d6e75"/>
    </linearGradient>
    <radialGradient id="poolglow" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- Pool deck and water -->
  <polygon points="0,210 640,210 640,360 0,360" fill="#0c2326"/>
  <!-- Pool shape in perspective -->
  <polygon points="120,230 520,230 580,340 60,340" fill="#0f464c"/>
  <circle cx="320" cy="285" r="140" fill="url(#poolglow)"/>
  <!-- Water ripples -->
