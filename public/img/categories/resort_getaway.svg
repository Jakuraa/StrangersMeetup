  <path d="M100 100 Q60 80 20 110 M100 100 Q80 60 50 70 M100 100 Q120 60 150 75 M100 100 Q130 90 160 120 M100 100 Q105 130 110 160" stroke="#061314" stroke-width="3" fill="none"/>
  <!-- Palm tree right -->
  <path d="M600 360 Q570 210 540 120" stroke="#061314" stroke-width="5" fill="none"/>
  <path d="M540 120 Q500 100 470 120 M540 120 Q520 80 490 90 M540 120 Q560 80 590 95 M540 120 Q570 110 610 135" stroke="#061314" stroke-width="3" fill="none"/>
</svg>