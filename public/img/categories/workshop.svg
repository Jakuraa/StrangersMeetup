<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3d3119"/>
      <stop offset="50%" stop-color="#1f180c"/>
      <stop offset="100%" stop-color="#0d0a05"/>
    </radialGradient>
    <radialGradient id="desklamp" cx="60%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#eab308" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Work light cone -->
  <circle cx="380" cy="140" r="180" fill="url(#desklamp)"/>
  <!-- Drafting lamp arm silhouette -->
  <path d="M520 280 L480 180 L410 90 L380 110" stroke="#713f12" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M370 100 Q385 90 400 110 L360 135 Z" fill="#291a0c"/>
  <circle cx="375" cy="120" r="6" fill="#fef08a"/>
  <!-- Workbench in perspective -->
  <polygon points="0,230 640,230 640,360 0,360" fill="#21190d"/>
  <line x1="0" y1="230" x2="640" y2="230" stroke="#543c1c" stroke-width="2"/>
  <!-- Open sketchbook on desk -->
  <polygon points="200,250 340,250 355,310 180,310" fill="#fefce8" opacity="0.85"/>
  <line x1="270" y1="250" x2="268" y2="310" stroke="#ca8a04" stroke-width="1.5"/>
  <!-- Pencil -->
  <line x1="375" y1="260" x2="415" y2="300" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
</svg>