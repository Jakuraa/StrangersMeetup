# Render deployment blueprint for StrangersMeetup Control MCP service
# Documentation: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: strangersmeetup-control-mcp
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: false
    buildCommand: npm ci --omit=dev
    startCommand: node mcp/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_API_KEY
        sync: false
      - key: WEBSITE_URL
        value: https://strangersmeetup-virid.vercel.app
      - key: MCP_LOG_STDOUT
        value: "true"
